apiVersion: delivery.eac.dev/v1alpha1
kind: PipelineCatalog
metadata:
  name: eac-pipeline-catalog
spec:
  version: 0.4.3
  profiles:
    - name: nuget-ci
      family: packages
      format: nuget
      resource: eac-nuget-ci
      path: catalog/profiles/packages/nuget/pipelines/continuous-integration.yaml
      status: implemented
    - name: nuget-kafka-ci
      family: packages
      format: nuget
      integration: kafka
      resource: eac-nuget-kafka-ci
      path: catalog/profiles/packages/nuget/pipelines/continuous-integration-kafka.yaml
      status: implemented
    - name: nuget-release-candidate
      family: packages
      format: nuget
      resource: eac-nuget-release-candidate
      path: catalog/profiles/packages/nuget/pipelines/release-candidate.yaml
      status: implemented
    - name: nuget-publish
      family: packages
      format: nuget
      resource: eac-nuget-prerelease-publication
      path: catalog/profiles/packages/nuget/pipelines/prerelease-publication.yaml
      status: implemented
    - name: nuget-stable-publish
      family: packages
      format: nuget
      resource: eac-nuget-stable-publication
      path: catalog/profiles/packages/nuget/pipelines/stable-publication.yaml
      status: implemented
    - name: npm-package
      family: packages
      format: npm
      status: planned
    - name: angular-web
      family: applications
      technology: angular
      status: planned
    - name: dotnet-service
      family: services
      technology: dotnet
      status: planned
    - name: deployment
      family: deployments
      status: planned
