apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: eac-deployment-promotion
  annotations:
    pipelinesascode.tekton.dev/task: >-
      [https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.5.0/catalog/shared/tasks/git-checkout/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.5.0/catalog/profiles/deployments/tasks/promote-by-digest/task.yaml]
  labels:
    app.kubernetes.io/name: eac-pipeline-catalog
    app.kubernetes.io/component: deployment-promotion
    app.kubernetes.io/version: 0.5.0
spec:
  params:
    - {name: repo-url, type: string}
    - {name: revision, type: string}
    - {name: target-api, type: string}
    - {name: target-namespace, type: string}
    - {name: manifest-path, type: string, default: deploy}
    - {name: workload, type: string}
    - {name: container, type: string}
    - {name: image-reference, type: string}
    - {name: smoke-url, type: string, default: ""}
  workspaces:
    - {name: source}
  tasks:
    - name: checkout
      taskRef: {kind: Task, name: eac-git-checkout}
      params:
        - {name: repo-url, value: $(params.repo-url)}
        - {name: revision, value: $(params.revision)}
      workspaces:
        - {name: source, workspace: source}
    - name: promote
      runAfter: [checkout]
      taskRef: {kind: Task, name: eac-deployment-promote-by-digest}
      params:
        - {name: target-api, value: $(params.target-api)}
        - {name: target-namespace, value: $(params.target-namespace)}
        - {name: manifest-path, value: $(params.manifest-path)}
        - {name: workload, value: $(params.workload)}
        - {name: container, value: $(params.container)}
        - {name: image-reference, value: $(params.image-reference)}
        - {name: smoke-url, value: $(params.smoke-url)}
      workspaces:
        - {name: source, workspace: source}
  results:
    - {name: commit-sha, value: $(tasks.checkout.results.commit-sha)}
    - {name: artifact-uri, value: $(tasks.promote.results.deployed-image)}
    - {name: deployment-status, value: $(tasks.promote.results.deployment-status)}
