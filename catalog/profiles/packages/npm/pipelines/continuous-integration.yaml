apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: eac-npm-ci
  annotations:
    pipelinesascode.tekton.dev/task: >-
      [https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v__CATALOG_RELEASE_VERSION__/catalog/shared/tasks/git-checkout/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v__CATALOG_RELEASE_VERSION__/catalog/profiles/packages/npm/tasks/verify-and-pack/task.yaml]
  labels:
    app.kubernetes.io/name: eac-pipeline-catalog
    app.kubernetes.io/component: npm-ci
    app.kubernetes.io/version: 0.5.0
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  tasks:
    - name: checkout
      taskRef: {kind: Task, name: eac-git-checkout}
      params:
        - {name: repo-url, value: $(params.repo-url)}
        - {name: revision, value: $(params.revision)}
      workspaces:
        - {name: source, workspace: source}
    - name: verify-and-pack
      runAfter: [checkout]
      taskRef: {kind: Task, name: eac-npm-verify-and-pack}
      workspaces:
        - {name: source, workspace: source}
  results:
    - {name: commit-sha, value: $(tasks.checkout.results.commit-sha)}
    - {name: product-version, value: $(tasks.verify-and-pack.results.package-version)}
    - {name: artifact-digest, value: $(tasks.verify-and-pack.results.package-digest)}
    - {name: test-status, value: $(tasks.verify-and-pack.results.test-status)}
