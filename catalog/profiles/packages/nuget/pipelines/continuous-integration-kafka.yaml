apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: eac-nuget-kafka-ci
  annotations:
    pipelinesascode.tekton.dev/task: >-
      [https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.3/catalog/shared/tasks/git-checkout/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.3/catalog/profiles/packages/nuget/tasks/repository-validate/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.3/catalog/profiles/packages/nuget/tasks/dotnet-build/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.3/catalog/profiles/packages/nuget/tasks/dotnet-test-kafka/task.yaml]
  labels:
    app.kubernetes.io/name: eac-pipeline-catalog
    app.kubernetes.io/component: nuget-kafka-ci
    app.kubernetes.io/version: 0.4.3
spec:
  description: Executes the reusable continuous integration contract for a .NET NuGet repository against ephemeral Kafka.
  params:
    - name: repo-url
      type: string
      description: HTTPS or Git URL of the repository.
    - name: revision
      type: string
      default: main
      description: Branch, tag, or immutable commit to verify.
    - name: configuration
      type: string
      default: Release
      description: .NET build configuration.
  workspaces:
    - name: source
      description: Source and dependency-cache workspace for this execution.
  tasks:
    - name: checkout
      taskRef:
        kind: Task
        name: eac-git-checkout
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
    - name: validate
      runAfter:
        - checkout
      taskRef:
        kind: Task
        name: eac-repository-validate
      workspaces:
        - name: source
          workspace: source
    - name: build
      runAfter:
        - validate
      taskRef:
        kind: Task
        name: eac-dotnet-build
      params:
        - name: configuration
          value: $(params.configuration)
        - name: package-version
          value: $(tasks.validate.results.package-version)
      workspaces:
        - name: source
          workspace: source
    - name: test
      runAfter:
        - build
      taskRef:
        kind: Task
        name: eac-dotnet-test-kafka
      params:
        - name: configuration
          value: $(params.configuration)
      workspaces:
        - name: source
          workspace: source
  results:
    - name: commit-sha
      description: Immutable commit verified by the pipeline.
      value: $(tasks.checkout.results.commit-sha)
    - name: validation-status
      description: Scope and governance validation status.
      value: $(tasks.validate.results.validation-status)
    - name: package-version
      description: Prerelease version validated by the repository.
      value: $(tasks.validate.results.package-version)
    - name: build-status
      description: Build contract status.
      value: $(tasks.build.results.build-status)
    - name: test-status
      description: Automated test status.
      value: $(tasks.test.results.test-status)
