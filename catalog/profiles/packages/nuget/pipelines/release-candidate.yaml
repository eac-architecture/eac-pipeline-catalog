apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: eac-nuget-release-candidate
  annotations:
    pipelinesascode.tekton.dev/task: >-
      [https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.3/catalog/shared/tasks/git-checkout/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.3/catalog/profiles/packages/nuget/tasks/repository-validate/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.3/catalog/profiles/packages/nuget/tasks/dotnet-build/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.3/catalog/profiles/packages/nuget/tasks/dotnet-test/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.3/catalog/profiles/packages/nuget/tasks/release-candidate/task.yaml]
  labels:
    app.kubernetes.io/name: eac-pipeline-catalog
    app.kubernetes.io/component: nuget-release-candidate
    app.kubernetes.io/version: 0.4.3
spec:
  description: Builds, tests, packages and verifies a NuGet candidate without publishing it.
  params:
    - name: repo-url
      type: string
      description: HTTPS or Git URL of the repository.
    - name: revision
      type: string
      default: main
      description: Branch, tag or immutable commit to verify.
  workspaces:
    - name: source
      description: Source, dependency cache and candidate-artifact workspace.
  tasks:
    - name: checkout
      taskRef:
        kind: Task
        name: eac-git-checkout
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
    - name: validate
      runAfter:
        - checkout
      taskRef:
        kind: Task
        name: eac-repository-validate
      workspaces:
        - name: source
          workspace: source
    - name: build
      runAfter:
        - validate
      taskRef:
        kind: Task
        name: eac-dotnet-build
      params:
        - name: configuration
          value: Release
        - name: package-version
          value: $(tasks.validate.results.package-version)
      workspaces:
        - name: source
          workspace: source
    - name: test
      runAfter:
        - build
      taskRef:
        kind: Task
        name: eac-dotnet-test
      params:
        - name: configuration
          value: Release
      workspaces:
        - name: source
          workspace: source
    - name: create-candidate
      runAfter:
        - test
      taskRef:
        kind: Task
        name: eac-dotnet-release-candidate
      params:
        - name: version
          value: $(tasks.validate.results.package-version)
        - name: commit-sha
          value: $(tasks.checkout.results.commit-sha)
      workspaces:
        - name: source
          workspace: source
  results:
    - name: commit-sha
      description: Immutable commit used by the candidate.
      value: $(tasks.checkout.results.commit-sha)
    - name: package-version
      description: Prerelease version read from the repository VERSION file.
      value: $(tasks.validate.results.package-version)
    - name: package-file
      description: Generated NuGet package file name.
      value: $(tasks.create-candidate.results.package-file)
    - name: package-sha256
      description: SHA-256 digest of the NuGet package.
      value: $(tasks.create-candidate.results.package-sha256)
    - name: symbols-file
      description: Generated symbol package file name.
      value: $(tasks.create-candidate.results.symbols-file)
    - name: sbom-sha256
      description: SHA-256 digest of the SPDX SBOM.
      value: $(tasks.create-candidate.results.sbom-sha256)
    - name: evidence-file
      description: Relative path to the release evidence document.
      value: $(tasks.create-candidate.results.evidence-file)
