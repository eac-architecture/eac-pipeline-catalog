apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: eac-nuget-prerelease-publication
  labels:
    app.kubernetes.io/name: eac-pipeline-catalog
    app.kubernetes.io/component: nuget-prerelease-publication
    app.kubernetes.io/version: 0.2.0
spec:
  description: Revalidates an immutable tag on its release branch and publishes the NuGet prerelease.
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
    - name: authorized-branch
      type: string
    - name: release-tag
      type: string
  workspaces:
    - name: source
  tasks:
    - name: checkout
      taskRef:
        kind: Task
        name: eac-git-checkout
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
    - name: validate
      runAfter: [checkout]
      taskRef:
        kind: Task
        name: eac-repository-validate
      workspaces:
        - name: source
          workspace: source
    - name: publication-gate
      runAfter: [validate]
      taskRef:
        kind: Task
        name: eac-release-revision-gate
      params:
        - name: authorized-branch
          value: $(params.authorized-branch)
        - name: release-tag
          value: $(params.release-tag)
        - name: package-version
          value: $(tasks.validate.results.package-version)
      workspaces:
        - name: source
          workspace: source
    - name: build
      runAfter: [publication-gate]
      taskRef:
        kind: Task
        name: eac-dotnet-build
      params:
        - name: configuration
          value: Release
        - name: package-version
          value: $(tasks.validate.results.package-version)
      workspaces:
        - name: source
          workspace: source
    - name: test
      runAfter: [build]
      taskRef:
        kind: Task
        name: eac-dotnet-test
      params:
        - name: configuration
          value: Release
      workspaces:
        - name: source
          workspace: source
    - name: create-candidate
      runAfter: [test]
      taskRef:
        kind: Task
        name: eac-dotnet-release-candidate
      params:
        - name: version
          value: $(tasks.validate.results.package-version)
        - name: commit-sha
          value: $(tasks.checkout.results.commit-sha)
      workspaces:
        - name: source
          workspace: source
    - name: publish
      runAfter: [create-candidate]
      taskRef:
        kind: Task
        name: eac-nuget-publish
      params:
        - name: package-file
          value: $(tasks.create-candidate.results.package-file)
      workspaces:
        - name: artifacts
          workspace: source
          subPath: artifacts
  results:
    - name: commit-sha
      value: $(tasks.publication-gate.results.approved-commit)
    - name: package-version
      value: $(tasks.validate.results.package-version)
    - name: release-tag
      value: $(tasks.publication-gate.results.approved-tag)
    - name: package-file
      value: $(tasks.create-candidate.results.package-file)
    - name: package-sha256
      value: $(tasks.create-candidate.results.package-sha256)
    - name: symbols-file
      value: $(tasks.create-candidate.results.symbols-file)
    - name: sbom-sha256
      value: $(tasks.create-candidate.results.sbom-sha256)
    - name: evidence-file
      value: $(tasks.create-candidate.results.evidence-file)
    - name: publication-status
      value: $(tasks.publish.results.publication-status)
