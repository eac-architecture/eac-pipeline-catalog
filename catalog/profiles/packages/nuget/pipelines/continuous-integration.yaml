apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: eac-nuget-ci
  annotations:
    pipelinesascode.tekton.dev/task: >-
      [https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.6/catalog/shared/tasks/git-checkout/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.6/catalog/profiles/packages/nuget/tasks/repository-validate/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.6/catalog/profiles/packages/nuget/tasks/dotnet-build/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.6/catalog/profiles/packages/nuget/tasks/dotnet-test/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.6/catalog/profiles/packages/nuget/tasks/dotnet-test-kafka/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.6/catalog/profiles/packages/nuget/tasks/dotnet-test-postgresql/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v0.4.6/catalog/profiles/packages/nuget/tasks/dotnet-test-mongodb/task.yaml]
  labels:
    app.kubernetes.io/name: eac-pipeline-catalog
    app.kubernetes.io/component: nuget-ci
    app.kubernetes.io/version: 0.4.6
spec:
  description: Executes the reusable continuous integration contract for a .NET NuGet repository.
  params:
    - name: repo-url
      type: string
      description: HTTPS or Git URL of the repository.
    - name: revision
      type: string
      default: main
      description: Branch, tag, or immutable commit to verify.
    - name: configuration
      type: string
      default: Release
      description: .NET build configuration.
    - name: integration-profile
      type: string
      default: default
      description: Optional integration environment required by the repository tests.
  workspaces:
    - name: source
      description: Source and dependency-cache workspace for this execution.
  tasks:
    - name: checkout
      taskRef:
        kind: Task
        name: eac-git-checkout
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
    - name: validate
      runAfter:
        - checkout
      taskRef:
        kind: Task
        name: eac-repository-validate
      params:
        - name: integration-profile
          value: $(params.integration-profile)
      workspaces:
        - name: source
          workspace: source
    - name: build
      runAfter:
        - validate
      taskRef:
        kind: Task
        name: eac-dotnet-build
      params:
        - name: configuration
          value: $(params.configuration)
        - name: package-version
          value: $(tasks.validate.results.package-version)
      workspaces:
        - name: source
          workspace: source
    - name: test-default
      runAfter:
        - build
      when:
        - input: $(params.integration-profile)
          operator: in
          values:
            - default
      taskRef:
        kind: Task
        name: eac-dotnet-test
      params:
        - name: configuration
          value: $(params.configuration)
      workspaces:
        - name: source
          workspace: source
    - name: test-kafka
      runAfter:
        - build
      when:
        - input: $(params.integration-profile)
          operator: in
          values:
            - kafka
      taskRef:
        kind: Task
        name: eac-dotnet-test-kafka
      params:
        - name: configuration
          value: $(params.configuration)
      workspaces:
        - name: source
          workspace: source
    - name: test-postgresql
      runAfter:
        - build
      when:
        - input: $(params.integration-profile)
          operator: in
          values:
            - postgresql
      taskRef:
        kind: Task
        name: eac-dotnet-test-postgresql
      params:
        - name: configuration
          value: $(params.configuration)
      workspaces:
        - name: source
          workspace: source
    - name: test-mongodb
      runAfter:
        - build
      when:
        - input: $(params.integration-profile)
          operator: in
          values:
            - mongodb
      taskRef:
        kind: Task
        name: eac-dotnet-test-mongodb
      params:
        - name: configuration
          value: $(params.configuration)
      workspaces:
        - name: source
          workspace: source
  results:
    - name: commit-sha
      description: Immutable commit verified by the pipeline.
      value: $(tasks.checkout.results.commit-sha)
    - name: validation-status
      description: Scope and governance validation status.
      value: $(tasks.validate.results.validation-status)
    - name: package-version
      description: Prerelease version validated by the repository.
      value: $(tasks.validate.results.package-version)
    - name: build-status
      description: Build contract status.
      value: $(tasks.build.results.build-status)
    - name: test-status
      description: Standard automated test status when the default profile is selected.
      value: $(tasks.test-default.results.test-status)
    - name: kafka-test-status
      description: Automated test status when the Kafka profile is selected.
      value: $(tasks.test-kafka.results.test-status)
    - name: postgresql-test-status
      description: Automated test status when the PostgreSQL profile is selected.
      value: $(tasks.test-postgresql.results.test-status)
    - name: mongodb-test-status
      description: Automated test status when the MongoDB profile is selected.
      value: $(tasks.test-mongodb.results.test-status)
