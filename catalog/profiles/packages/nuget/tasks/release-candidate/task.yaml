apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: eac-dotnet-release-candidate
  labels:
    app.kubernetes.io/name: eac-pipeline-catalog
    app.kubernetes.io/component: dotnet-release-candidate
    app.kubernetes.io/version: 0.4.5
spec:
  description: Creates and verifies a NuGet release candidate without publishing it.
  params:
    - name: version
      type: string
      description: Prerelease SemVer validated from the repository VERSION file.
    - name: commit-sha
      type: string
      description: Immutable source revision recorded in the evidence.
  workspaces:
    - name: source
      description: Workspace containing the repository, dependency cache and generated artifacts.
  results:
    - name: package-file
      description: Generated NuGet package file name.
    - name: package-sha256
      description: SHA-256 digest of the NuGet package.
    - name: symbols-file
      description: Generated symbol package file name.
    - name: sbom-sha256
      description: SHA-256 digest of the SPDX SBOM.
    - name: evidence-file
      description: Relative path to the release evidence document.
  stepTemplate:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
  steps:
    - name: create-candidate
      image: mcr.microsoft.com/dotnet/sdk:10.0.201
      workingDir: $(workspaces.source.path)/repository
      env:
        - name: PACKAGE_VERSION
          value: $(params.version)
        - name: RELEASE_COMMIT
          value: $(params.commit-sha)
        - name: BUILD_CONFIGURATION
          value: Release
        - name: CI
          value: "true"
        - name: DOTNET_CLI_HOME
          value: $(workspaces.source.path)/.home/dotnet
        - name: HOME
          value: /tekton/home
        - name: NUGET_PACKAGES
          value: $(workspaces.source.path)/.nuget/packages
        - name: ARTIFACTS_DIR
          value: $(workspaces.source.path)/artifacts
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        artifacts_dir="$(workspaces.source.path)/artifacts"
        packages_dir="$artifacts_dir/packages"
        sbom_dir="$artifacts_dir/sbom"
        evidence_dir="$artifacts_dir/evidence"
        rm -rf "$packages_dir" "$sbom_dir" "$evidence_dir"
        mkdir -p "$packages_dir" "$sbom_dir" "$evidence_dir"
        project="$(find src -type f -name '*.csproj' -exec grep -l '<IsPackable>true</IsPackable>' {} + | head -n 1)"
        package_id="$(sed -n 's:.*<PackageId>\([^<]*\)</PackageId>.*:\1:p' "$project" | head -n 1)"
        [[ -n "$package_id" ]] || package_id="$(basename "$project" .csproj)"
        [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]] || { printf '[ERROR] commit-sha must identify checked-out HEAD\n' >&2; exit 1; }
        dotnet pack "$project" --configuration "$BUILD_CONFIGURATION" --no-build --no-restore -p:PackageVersion="$PACKAGE_VERSION" -p:PackageOutputPath="$packages_dir"
        package_file="$packages_dir/$package_id.$PACKAGE_VERSION.nupkg"
        symbols_file="$packages_dir/$package_id.$PACKAGE_VERSION.snupkg"
        [[ -f "$package_file" && -f "$symbols_file" ]] || { printf '[ERROR] Candidate package inventory is incomplete\n' >&2; exit 1; }
        smoke_dir="$(mktemp -d)"
        trap 'rm -rf "$smoke_dir"' EXIT
        cat > "$smoke_dir/Smoke.csproj" <<EOF
        <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup><ItemGroup><PackageReference Include="$package_id" Version="$PACKAGE_VERSION" /></ItemGroup></Project>
        EOF
        cat > "$smoke_dir/NuGet.Config" <<EOF
        <configuration><packageSources><clear/><add key="candidate" value="$packages_dir"/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources><packageSourceMapping><packageSource key="candidate"><package pattern="$package_id"/></packageSource><packageSource key="nuget.org"><package pattern="*"/></packageSource></packageSourceMapping></configuration>
        EOF
        printf 'internal static class Smoke { private static void Main() { } }\n' > "$smoke_dir/Program.cs"
        dotnet restore "$smoke_dir/Smoke.csproj" --configfile "$smoke_dir/NuGet.Config" --no-cache
        dotnet build "$smoke_dir/Smoke.csproj" --configuration Release --no-restore
        dotnet tool restore --configfile NuGet.Config
        dotnet tool run sbom-tool generate -b "$packages_dir" -bc . -pn "$package_id" -pv "$PACKAGE_VERSION" -ps 'Organization: EAC Architecture' -nsb 'https://github.com/eac-architecture/sbom'
        dotnet tool run sbom-tool validate -b "$packages_dir" -o "$evidence_dir/sbom-validation.json" -mi SPDX:2.2
        mkdir -p "$sbom_dir"
        mv "$packages_dir/_manifest/spdx_2.2" "$sbom_dir/"
        rm -rf "$packages_dir/_manifest"
        sbom_file="$artifacts_dir/sbom/spdx_2.2/manifest.spdx.json"
        (cd "$artifacts_dir" && sha256sum "packages/$(basename "$package_file")" "packages/$(basename "$symbols_file")" 'sbom/spdx_2.2/manifest.spdx.json') > "$evidence_dir/checksums.sha256"
        printf '{"packageId":"%s","version":"%s","commit":"%s","sbom":"SPDX-2.2","smokeTest":"Succeeded"}\n' "$package_id" "$PACKAGE_VERSION" "$RELEASE_COMMIT" > "$evidence_dir/release-evidence.json"

        basename "$package_file" | tr -d '\n' > "$(results.package-file.path)"
        sha256sum "$package_file" | awk '{printf $1}' > "$(results.package-sha256.path)"
        basename "$symbols_file" | tr -d '\n' > "$(results.symbols-file.path)"
        sha256sum "$sbom_file" | awk '{printf $1}' > "$(results.sbom-sha256.path)"
        printf 'evidence/release-evidence.json' > "$(results.evidence-file.path)"
