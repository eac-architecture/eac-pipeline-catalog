apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: eac-dotnet-build
  labels:
    app.kubernetes.io/name: eac-pipeline-catalog
    app.kubernetes.io/component: dotnet-build
    app.kubernetes.io/version: 0.4.8
spec:
  description: Restores, formats and builds the repository solution directly.
  params:
    - name: configuration
      type: string
      default: Release
      description: .NET build configuration.
    - name: package-version
      type: string
      description: SemVer resolved from the repository VERSION file.
  workspaces:
    - name: source
      description: Workspace containing the validated repository.
  results:
    - name: build-status
      description: Build contract status.
  stepTemplate:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
  steps:
    - name: build
      image: mcr.microsoft.com/dotnet/sdk:10.0.201
      workingDir: $(workspaces.source.path)/repository
      env:
        - name: BUILD_CONFIGURATION
          value: $(params.configuration)
        - name: PACKAGE_VERSION
          value: $(params.package-version)
        - name: CI
          value: "true"
        - name: DOTNET_CLI_HOME
          value: $(workspaces.source.path)/.home/dotnet
        - name: HOME
          value: /tekton/home
        - name: NUGET_PACKAGES
          value: $(workspaces.source.path)/.nuget/packages
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        status_file="$(results.build-status.path)"
        solution="$(find . -maxdepth 1 -type f \( -name '*.sln' -o -name '*.slnx' \) -print -quit)"
        dotnet restore "$solution" --configfile NuGet.Config --locked-mode
        dotnet format "$solution" --verify-no-changes --no-restore
        dotnet build "$solution" --configuration "$BUILD_CONFIGURATION" --no-restore "-p:Version=$PACKAGE_VERSION"
        printf 'Succeeded' > "$status_file"
