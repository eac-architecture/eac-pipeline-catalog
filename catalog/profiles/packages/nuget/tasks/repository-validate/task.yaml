apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: eac-repository-validate
  labels:
    app.kubernetes.io/name: eac-pipeline-catalog
    app.kubernetes.io/component: repository-validation
    app.kubernetes.io/version: 0.4.7
spec:
  description: Validates the declarative contract of a .NET NuGet repository without invoking repository scripts.
  params:
    - name: integration-profile
      type: string
      default: default
      description: Optional integration environment selected by the NuGet CI Pipeline.
  workspaces:
    - name: source
      description: Workspace containing the checked-out repository.
  results:
    - name: validation-status
      description: Repository validation status.
    - name: package-version
      description: Prerelease SemVer resolved from the repository VERSION file.
    - name: integration-profile
      description: Integration profile resolved from the repository binding or runner fallback.
  stepTemplate:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
  steps:
    - name: validate
      image: mcr.microsoft.com/dotnet/sdk:10.0.201
      workingDir: $(workspaces.source.path)/repository
      env:
        - name: CI
          value: "true"
        - name: HOME
          value: /tekton/home
        - name: INTEGRATION_PROFILE
          value: $(params.integration-profile)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        status_file="$(results.validation-status.path)"
        fail() { printf 'Failed' > "$status_file"; printf '[ERROR] %s\n' "$1" >&2; exit 1; }
        valid_profile() {
          [[ "$1" == "default" || "$1" == "kafka" || "$1" == "postgresql" || "$1" == "mongodb" ]]
        }
        valid_profile "$INTEGRATION_PROFILE" || fail 'integration-profile must be default, kafka, postgresql or mongodb'
        binding='.tekton/continuous-integration.yaml'
        declared_profile=''
        if [[ -f "$binding" ]]; then
          declared_profile="$(awk '
            /^[[:space:]]*- name: integration-profile[[:space:]]*$/ { profile = 1; next }
            profile && /^[[:space:]]*value:[[:space:]]*/ {
              sub(/^[[:space:]]*value:[[:space:]]*/, "")
              gsub(/["'\''[:space:]]/, "")
              print
              exit
            }
            profile && /^[[:space:]]*- name:/ { profile = 0 }
          ' "$binding")"
        fi
        if [[ -n "$declared_profile" ]]; then
          valid_profile "$declared_profile" || fail 'repository binding declares an unsupported integration-profile'
          if [[ "$declared_profile" != "$INTEGRATION_PROFILE" ]]; then
            printf '[WARN] Runner requested integration-profile=%s; repository binding selects %s\n' "$INTEGRATION_PROFILE" "$declared_profile"
          fi
          resolved_profile="$declared_profile"
        else
          resolved_profile="$INTEGRATION_PROFILE"
        fi
        [[ -s VERSION ]] || fail 'VERSION is required'
        package_version="$(tr -d '[:space:]' < VERSION)"
        [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || fail 'VERSION must be governed SemVer'
        [[ -s global.json ]] || fail 'global.json is required'
        [[ -s NuGet.Config ]] || fail 'NuGet.Config is required'
        [[ -s .config/dotnet-tools.json ]] || fail '.config/dotnet-tools.json is required'
        mapfile -t solutions < <(find . -maxdepth 1 -type f \( -name '*.sln' -o -name '*.slnx' \) -print)
        [[ "${#solutions[@]}" -eq 1 ]] || fail 'Exactly one root solution is required'
        mapfile -t packages < <(find src -type f -name '*.csproj' -exec grep -l '<IsPackable>true</IsPackable>' {} + 2>/dev/null)
        [[ "${#packages[@]}" -eq 1 ]] || fail 'Exactly one packable project is required under src'
        if find .tekton -type f -name '*.yaml' -print0 2>/dev/null | xargs -0 -r grep -En '^[[:space:]]*(kind:[[:space:]]*(Pipeline|Task)[[:space:]]*$|pipelineSpec:)'; then
          fail 'Components may bind catalog Pipelines but cannot implement Pipeline, Task or pipelineSpec'
        fi
        printf 'Succeeded' > "$status_file"
        printf '%s' "$package_version" > "$(results.package-version.path)"
        printf '%s' "$resolved_profile" > "$(results.integration-profile.path)"
        printf '[OK] Integration profile resolved: %s\n' "$resolved_profile"
        printf '[OK] Declarative NuGet repository contract validated\n'
