apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: eac-release-revision-gate
  labels:
    app.kubernetes.io/name: eac-pipeline-catalog
    app.kubernetes.io/component: release-revision-gate
    app.kubernetes.io/version: 0.4.2
spec:
  description: Verifies that an authorized branch and immutable publication tag identify the checked-out commit.
  params:
    - name: authorized-branch
      type: string
    - name: release-tag
      type: string
    - name: package-version
      type: string
    - name: publication-channel
      type: string
      description: Publication channel; prerelease or stable.
  workspaces:
    - name: source
  results:
    - name: approved-commit
      description: Immutable commit accepted by the publication gate.
    - name: approved-tag
      description: Immutable publication tag accepted by the publication gate.
  volumes:
    - name: git-credentials
      secret:
        secretName: eac-git-checkout
        optional: true
  stepTemplate:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
  steps:
    - name: verify-release-source
      image: alpine/git:2.49.1
      workingDir: $(workspaces.source.path)/repository
      env:
        - name: HOME
          value: /tekton/home
        - name: AUTHORIZED_BRANCH
          value: $(params.authorized-branch)
        - name: RELEASE_TAG
          value: $(params.release-tag)
        - name: PACKAGE_VERSION
          value: $(params.package-version)
        - name: PUBLICATION_CHANNEL
          value: $(params.publication-channel)
      volumeMounts:
        - name: git-credentials
          mountPath: /var/run/eac/git-credentials
          readOnly: true
      script: |
        #!/usr/bin/env sh
        set -eu

        credentials_path=/var/run/eac/git-credentials
        if [ -s "$credentials_path/username" ] && [ -s "$credentials_path/password" ]; then
          git config --global credential.helper store
          {
            printf 'protocol=https\n'
            printf 'host=github.com\n'
            printf 'username=%s\n' "$(cat "$credentials_path/username")"
            printf 'password=%s\n\n' "$(cat "$credentials_path/password")"
          } | git credential approve
        fi

        case "$PUBLICATION_CHANNEL" in
          prerelease)
            case "$AUTHORIZED_BRANCH" in
              release/*) ;;
              *) printf '[ERROR] Prerelease publication requires a release/* branch\n' >&2; exit 1 ;;
            esac
            case "$RELEASE_TAG" in
              v*-alpha.*|v*-beta.*|v*-rc.*) ;;
              *) printf '[ERROR] Prerelease publication requires a v*-alpha.*, v*-beta.* or v*-rc.* tag\n' >&2; exit 1 ;;
            esac
            ;;
          stable)
            if [ "$AUTHORIZED_BRANCH" != "main" ]; then
              printf '[ERROR] Stable publication requires the main branch\n' >&2
              exit 1
            fi
            case "$PACKAGE_VERSION" in
              *-*) printf '[ERROR] Stable publication requires a version without a prerelease suffix\n' >&2; exit 1 ;;
            esac
            case "$RELEASE_TAG" in
              v*-*) printf '[ERROR] Stable publication requires a vX.Y.Z tag\n' >&2; exit 1 ;;
              v*.*.*) ;;
              *) printf '[ERROR] Stable publication requires a vX.Y.Z tag\n' >&2; exit 1 ;;
            esac
            ;;
          *)
            printf '[ERROR] Unsupported publication channel: %s\n' "$PUBLICATION_CHANNEL" >&2
            exit 1
            ;;
        esac
        if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
          printf '[ERROR] Tag %s does not match repository VERSION %s\n' \
            "$RELEASE_TAG" "$PACKAGE_VERSION" >&2
          exit 1
        fi

        checked_out="$(git rev-parse HEAD)"
        remote_branch="$(git ls-remote --exit-code origin "refs/heads/$AUTHORIZED_BRANCH" | awk '{print $1}')"
        remote_tag="$(git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
        if [ -z "$remote_branch" ] || [ -z "$remote_tag" ] || \
           [ "$checked_out" != "$remote_branch" ] || [ "$checked_out" != "$remote_tag" ]; then
          printf '[ERROR] Commit, origin/%s and tag %s must identify the same revision\n' \
            "$AUTHORIZED_BRANCH" "$RELEASE_TAG" >&2
          exit 1
        fi
        printf '%s' "$checked_out" > "$(results.approved-commit.path)"
        printf '%s' "$RELEASE_TAG" > "$(results.approved-tag.path)"
        printf '[OK] Publication gate accepted %s at %s\n' \
          "$RELEASE_TAG" "$(printf '%s' "$checked_out" | cut -c1-12)"
