apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: eac-angular-ci
  annotations:
    pipelinesascode.tekton.dev/task: >-
      [https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v__CATALOG_RELEASE_VERSION__/catalog/shared/tasks/git-checkout/task.yaml,
      https://raw.githubusercontent.com/eac-architecture/eac-pipeline-catalog/v__CATALOG_RELEASE_VERSION__/catalog/profiles/applications/angular/tasks/build-reproducible/task.yaml]
  labels:
    app.kubernetes.io/name: eac-pipeline-catalog
    app.kubernetes.io/component: angular-ci
    app.kubernetes.io/version: 0.5.0
spec:
  params:
    - {name: repo-url, type: string}
    - {name: revision, type: string, default: main}
  workspaces:
    - {name: source}
  tasks:
    - name: checkout
      taskRef: {kind: Task, name: eac-git-checkout}
      params:
        - {name: repo-url, value: $(params.repo-url)}
        - {name: revision, value: $(params.revision)}
      workspaces:
        - {name: source, workspace: source}
    - name: build-reproducible
      runAfter: [checkout]
      taskRef: {kind: Task, name: eac-angular-build-reproducible}
      workspaces:
        - {name: source, workspace: source}
  results:
    - {name: commit-sha, value: $(tasks.checkout.results.commit-sha)}
    - {name: artifact-digest, value: $(tasks.build-reproducible.results.bundle-digest)}
    - {name: build-status, value: $(tasks.build-reproducible.results.build-status)}
